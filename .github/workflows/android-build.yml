
name: Android Build and Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Android project files
        id: android
        shell: bash
        run: |
          if [ -f mobile-app/app/build.gradle.kts ] && \
             [ -f mobile-app/gradle/wrapper/gradle-wrapper.jar ] && \
             [ -f mobile-app/gradle/wrapper/gradle-wrapper.properties ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Android project is incomplete. Build and tests skipped."
          fi

      - name: Build Android application
        if: steps.android.outputs.ready == 'true'
        working-directory: mobile-app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Run Android unit tests
        if: steps.android.outputs.ready == 'true'
        working-directory: mobile-app
        run: ./gradlew testDebugUnitTest
